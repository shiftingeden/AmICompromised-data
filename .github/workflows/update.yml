# Workflow for the public data repo (shiftingeden/AmICompromised-data).
# Copy Tools/generate_apple_kev.py into that repo next to this folder.
# Regenerates apple-kev.json daily and commits it if CISA added Apple bugs.
name: Update exploited-bug catalog
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p Data && python3 generate_apple_kev.py && mv Data/apple-kev.json apple-kev.json
      - run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add apple-kev.json
          git diff --cached --quiet || git commit -m "Update apple-kev.json"
          git push
